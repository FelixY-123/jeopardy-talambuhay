name: Keep Render server awake

# If the ping step fails (non-2xx/4xx+ response, timeout, etc.), this workflow
# run fails, and GitHub emails the repo owner automatically per their
# notification settings at github.com/settings/notifications (Actions section).
# No extra email step needed.

on:
  schedule:
    # Runs every 15 minutes, every day. The script itself checks the time
    # in America/New_York and only pings between 8am-5pm ET.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/keep-alive.sh
